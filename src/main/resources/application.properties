spring.application.name=solar-conectado
server.port=8080

# Banco de dados MariaDB
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/solar_conectado}
spring.datasource.username=${MYSQLUSER:solar}
spring.datasource.password=${MYSQLPASSWORD:Minaura$2800}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
# update = cria/atualiza tabelas automaticamente (bom para dev, trocar por validate em prod)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

